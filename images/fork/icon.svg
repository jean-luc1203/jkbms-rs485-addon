<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b73"/><stop offset="1" stop-color="#0f1f40"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- battery body -->
  <rect x="38" y="62" width="168" height="96" rx="16" fill="none" stroke="#e2e8f0" stroke-width="10"/>
  <rect x="206" y="88" width="16" height="44" rx="6" fill="#e2e8f0"/>
  <!-- four cells -->
  <rect x="54"  y="78" width="30" height="64" rx="6" fill="url(#cell)"/>
  <rect x="91"  y="78" width="30" height="64" rx="6" fill="url(#cell)"/>
  <rect x="128" y="78" width="30" height="64" rx="6" fill="url(#cell)"/>
  <rect x="165" y="78" width="26" height="64" rx="6" fill="#facc15"/>
  <!-- data line -->
  <polyline points="40,196 82,196 98,178 116,214 134,186 150,196 216,196" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
