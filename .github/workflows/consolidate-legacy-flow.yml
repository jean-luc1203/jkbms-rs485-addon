name: Consolidate Legacy canonical flow

on:
  push:
    branches:
      - maintenance/legacy-flow-consolidation-docker
    paths:
      - '.github/workflows/consolidate-legacy-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify expected Legacy 4.1.14 source flow
        run: |
          test "$(git hash-object rootfs/etc/node-red/flows.json)" = "3467962b30df2ea0d2c4855cccd7ead9d542d913"
      - name: Integrate issue 192 into canonical flow
        run: |
          node issue192_patch.cjs rootfs/etc/node-red/flows.json
          node - <<'NODE'
          const fs = require('fs');
          const f = JSON.parse(fs.readFileSync('rootfs/etc/node-red/flows.json', 'utf8'));
          if (f.length !== 590) throw Error('Node count mismatch');
          if (!f.find(n => n.id === 'c90f119270193bd9').func.includes('premium.dashboard_bms_seen')) throw Error('Premium patch missing');
          if (!f.find(n => n.id === '9612d6721a03dd26').func.includes("packs.add('master')")) throw Error('Home Energy patch missing');
          for (const n of f.filter(n => n.type === 'function')) new Function(n.func);
          console.log('Canonical flow and Function node syntax: PASS');
          NODE
      - name: Remove obsolete issue 192 build-time patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Dockerfile')
          s=p.read_text()
          old='COPY issue192_patch.cjs /opt/issue192_patch.cjs\nRUN node /opt/issue192_patch.cjs && rm /opt/issue192_patch.cjs\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,''))
          p=Path('standalone/Dockerfile')
          s=p.read_text()
          start='# Apply the same Issue #192 correction as the HAOS image.'
          end='# Env variables'
          assert s.count(start)==1 and s.count(end)==1
          a=s.index(start); b=s.index(end)
          p.write_text(s[:a]+s[b:])
          Path('issue192_patch.cjs').unlink()
          PY
      - name: Commit canonical flow consolidation to maintenance branch only
        run: |
          test "$GITHUB_REF_NAME" = "maintenance/legacy-flow-consolidation-docker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs/etc/node-red/flows.json Dockerfile standalone/Dockerfile issue192_patch.cjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "refactor: integrate issue 192 directly into canonical flows.json"
          git push origin HEAD:maintenance/legacy-flow-consolidation-docker
