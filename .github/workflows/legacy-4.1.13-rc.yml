name: Legacy 4.1.13 release candidate regression
on:
  push:
    branches:
      - release/legacy-4.1.13-rc1
  pull_request:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'rootfs/etc/node-red/issue166-*'
      - 'rootfs/etc/node-red/flows.json'
      - 'rootfs/etc/s6-overlay/s6-rc.d/init-nodered/run'
      - 'tests/issue166-*'
      - '.github/workflows/legacy-4.1.13-rc.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify patcher source syntax
        run: node --check rootfs/etc/node-red/issue166-apply.cjs
      - name: Construct corrected production Legacy flow (pristine 4.1.12)
        run: node rootfs/etc/node-red/issue166-apply.cjs rootfs/etc/node-red/flows.json /tmp/legacy-4.1.13-rc1.json
      - name: Verify generated flow parses
        run: node -e "JSON.parse(require('fs').readFileSync('/tmp/legacy-4.1.13-rc1.json','utf8'))"
      - name: Validate identities, CRCs, watchdogs and production packaging
        run: ISSUE166_FLOWS=/tmp/legacy-4.1.13-rc1.json node --test tests/issue166-ghost-bms.test.cjs
