name: Publish official JK-BMS Legacy v4.1.13

on:
  push:
    branches:
      - main
    paths:
      - config.yaml
      - RELEASE_NOTES_4.1.13.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v4-1-13:
    if: github.repository == 'jean-luc1203/jkbms-rs485-addon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and source script executable
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^version: 4\.1\.13$' config.yaml
          test -x rootfs/etc/s6-overlay/s6-rc.d/init-nodered/run
          test "$(git ls-files --stage rootfs/etc/s6-overlay/s6-rc.d/init-nodered/run | awk '{print $1}')" = 100755
          test -s RELEASE_NOTES_4.1.13.md
          grep -q 'FULL HOME ASSISTANT BACKUP' RELEASE_NOTES_4.1.13.md
      - name: Build corrected Legacy 4.1.13 flow
        shell: bash
        run: |
          set -euo pipefail
          node --check rootfs/etc/node-red/issue166-apply.cjs
          node rootfs/etc/node-red/issue166-apply.cjs rootfs/etc/node-red/flows.json /tmp/legacy-4.1.13-release.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/legacy-4.1.13-release.json','utf8'))"
      - name: Regression tests (81 cases)
        env:
          ISSUE166_FLOWS: /tmp/legacy-4.1.13-release.json
        run: node --test tests/issue166-ghost-bms.test.cjs
      - name: Upgrade simulations (2 cases)
        run: node --test tests/legacy-4.1.13-upgrade.test.cjs
      - name: Publish GitHub tag and stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.1.13 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v4.1.13 GitHub Release already exists; nothing to publish"
            exit 0
          fi
          gh release create v4.1.13 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SmartPhoton JK-BMS Legacy v4.1.13" \
            --notes-file RELEASE_NOTES_4.1.13.md \
            --latest
