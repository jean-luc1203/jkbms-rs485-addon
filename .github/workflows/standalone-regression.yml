name: Standalone Docker regression

on:
  push:
    branches:
      - maintenance/legacy-flow-consolidation-docker
  pull_request:
    paths:
      - 'standalone/**'
      - 'rootfs/etc/node-red/flows.json'
      - 'issue192_patch.cjs'
      - 'package.json'
      - '.github/workflows/standalone-regression.yml'
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone shell syntax
        run: sh -n standalone/entrypoint.sh
      - name: Build standalone image
        run: docker build --pull -f standalone/Dockerfile -t jkbms-standalone:ci .
      - name: Check that Issue 192 is integrated in the image
        run: |
          docker run --rm --entrypoint node jkbms-standalone:ci -e '
            const fs = require("fs");
            const flows = JSON.parse(fs.readFileSync("/data/flows.json","utf8"));
            const premium = flows.find(n=>n.id==="c90f119270193bd9");
            const home = flows.find(n=>n.id==="9612d6721a03dd26");
            if (!premium?.func.includes("premium.dashboard_bms_seen")) process.exit(1);
            if (!home?.func.includes("packs.add(\x27master\x27)")) process.exit(2);
            console.log("Issue #192 standalone flow: PASS");
          '
      - name: Check standalone configuration generation
        run: |
          docker run --rm --entrypoint node -e MQTTADRESSE_PORT=127.0.0.1:1883 jkbms-standalone:ci /usr/src/node-red/envoptions.js
      - name: Verify Node-RED starts (no BMS hardware required)
        run: |
          docker run -d --name jkbms-ci -e MQTTADRESSE_PORT=127.0.0.1:1883 -p 1880:1880 jkbms-standalone:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:1880/ >/dev/null; then
              echo "Node-RED HTTP endpoint: PASS"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' jkbms-ci | grep -q true; then
              docker logs jkbms-ci
              exit 1
            fi
            sleep 2
          done
          docker logs jkbms-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs jkbms-ci 2>&1 || true
      - name: Cleanup
        if: always()
        run: docker rm -f jkbms-ci 2>/dev/null || true
